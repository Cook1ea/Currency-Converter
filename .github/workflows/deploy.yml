name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 部署到 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # 项目部署在 https://<user>.github.io/<repo>/ 下，需要把 Vite 的 base
        # 设为 "/<repo>/"。如果改用自定义域名的根目录部署，把这里改成 "/" 即可。
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add 404 fallback
        # 单页应用：把 index.html 复制一份为 404.html，
        # 这样即使用户直接访问不存在的子路径也不会看到 GitHub 的 404 页面。
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
